<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedQueryAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-serif: Georgia, "Times New Roman", serif;
      --border-radius-lg: 16px;
      --border-radius-md: 8px;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #EEF4FB;
      color: #042C53;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5vw 8vw;
    }

    .hero-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1100px;
      gap: 4rem;
    }

    .hero-card {
      flex: 1;
      min-width: 0;
    }

    .hero-image {
      flex: 0 0 420px;
      max-width: 420px;
    }

    .hero-image img {
      width: 100%;
      height: auto;
      border-radius: var(--border-radius-lg);
      display: block;
      object-fit: cover;
    }

    @media (max-width: 860px) {
      .hero-layout { flex-direction: column; }
      .hero-image { flex: 0 0 auto; max-width: 100%; }
    }

    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 3rem;
    }

    .logo-lockup span {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 400;
      color: #042C53;
      letter-spacing: -0.01em;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(32px, 4.5vw, 52px);
      font-weight: 400;
      line-height: 1.15;
      margin: 0 0 1.5rem;
      max-width: 700px;
      letter-spacing: -0.01em;
      color: #042C53;
    }

    h1 .accent { color: #378ADD; }

    .subtitle {
      font-size: clamp(15px, 1.5vw, 18px);
      color: #0C447C;
      margin: 0 0 2.5rem;
      max-width: 560px;
      line-height: 1.6;
    }

    .cta-btn {
      font-size: 15px;
      padding: 12px 28px;
      background: #042C53;
      color: #EEF4FB;
      border: none;
      border-radius: var(--border-radius-md);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2.5rem;
      transition: background 0.15s;
    }

    .cta-btn:hover { background: #0C447C; }

    .pills {
      display: flex;
      gap: 28px;
      padding-top: 1.75rem;
      border-top: 0.5px solid rgba(23, 95, 165, 0.2);
      flex-wrap: wrap;
    }

    .pills span { font-size: 14px; color: #0C447C; }
    .pills .dot  { font-size: 14px; color: #85B7EB; }
  </style>
</head>
<body>

  <div class="hero-layout">
  <div class="hero-card">

    <div class="logo-lockup">
      <svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>MedQueryAI logo</title>
        <rect x="2" y="2" width="40" height="40" rx="10" fill="#042C53" />
        <path d="M11 14 Q11 10 15 10 L29 10 Q33 10 33 14 L33 24 Q33 28 29 28 L20 28 L15 33 L15 28 Q11 28 11 24 Z" fill="#EEF4FB" />
        <line x1="22" y1="14" x2="22" y2="24" stroke="#042C53" stroke-width="2.4" stroke-linecap="round" />
        <line x1="17" y1="19" x2="27" y2="19" stroke="#042C53" stroke-width="2.4" stroke-linecap="round" />
      </svg>
      <span>MedQueryAI</span>
    </div>

    <h1>Clinical answers, grounded in trusted medical evidence.<span class="accent"> Instantly.</span></h1>

    <p class="subtitle">Ask questions and get responses backed by peer-reviewed sources, guidelines, and your institution's data.</p>

    <a href="/chat" class="cta-btn">Try the demo →</a>

    <div class="pills">
      <span>Cited sources</span>
      <span class="dot">·</span>
      <span>Refuses to guess</span>
      <span class="dot">·</span>
      <span>HIPAA-safe</span>
    </div>

  </div>

  <div class="hero-image">
    <img src="/static/stethoscope.jpeg" alt="Doctor with stethoscope" />
  </div>

  </div>

</body>
</html>
